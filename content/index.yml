cta:
  title: 'Ready to optimize your data and cloud investment?'
  description: 'Let Intraq simplify your operations and finances — from data entry to cloud cost intelligence. Partner with our specialists to transform how you manage information and expenditure.'
  links:
    - label: Start your project
      to: '#contact'
      trailingIcon: i-lucide-arrow-right
      color: primary
    - label: Discuss a global pilot
      to: '#contact'
      variant: subtle
      icon: i-lucide-globe