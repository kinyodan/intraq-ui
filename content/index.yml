# Refined content.yml for Intraq
# Strategy: "Africa's Data & Cloud Cost Platform, Built for Global Scale"

seo:
  title: "Intraq — Data & Cloud Cost Intelligence for Africa's Scaling Organizations"
  description: "Intraq partners with leading African enterprises, NGOs, and global teams to deliver trusted data management and cloud financial operations (FinOps). From data validation to cloud cost optimization, we ensure accuracy, security, and cost-efficiency for every decision."

title: "Data & Cloud Cost Intelligence for Africa's Scaling Organizations"
description: "Intraq provides trusted data management and cloud financial operations (FinOps) solutions. Built with deep African expertise, our platform delivers accuracy, security, and actionable intelligence for businesses scaling locally and globally."

hero:
  links:
    - label: Get started
      icon: i-lucide-arrow-right
      trailing: true
      color: primary
      to: 'register'
      size: xl
  # Optional addition: A small, proud tagline under the main title
  tagline: "Built in Africa for the world's most dynamic markets"

section:
  title: '[Transform]{.text-orange-600} your data and cloud financial operations'
  description: 'Empower your business with smart data management and cloud cost intelligence — built for accuracy, scalability, and financial control across Africa and beyond.'
  images:
    mobile: '/images/dashboard.jpg'
    desktop: '/images/dashboard.jpg'
  features:
    - title: Ensure data accuracy and financial clarity
      description: 'Minimize errors and optimize costs with expert-led data processes and cloud spend validation. Clean data and clear finances drive confident decisions.'
      class: border-l border-primary pl-4

    - title: Streamline operations and control cloud spend
      description: 'Centralize data and unify cloud financial management through modern solutions that simplify access, reporting, and cost accountability for teams.'
      class: border-l border-default pt-4 pl-4

    - title: Unlock insights that fuel growth and savings
      description: 'Turn raw information into actionable intelligence with Intraq’s analytics and FinOps tools, helping you make smarter decisions that impact both performance and budget.'
      class: border-l border-default pt-4 pl-4

features:
  title: 'Take control of your [data and cloud finances]{.text-primary}'
  description: 'Enhance accuracy, efficiency, and financial oversight with intelligent tools designed to simplify every step from data entry to cloud cost optimization.'
  features:
    # Existing data features enhanced with FinOps context
    - title: Smart Data & Cost Validation
      description: 'Automatically detect data inconsistencies and cloud cost anomalies to keep your records clean and your spending predictable.'
      icon: i-lucide-check-circle
      ui:
        leading: bg-accented/50 p-2 rounded-md border border-muted border-dashed

    - title: Workflow & Cost Monitoring
      description: 'Track data entry progress and cloud expenditure in real time to ensure operational efficiency and budget accountability.'
      icon: i-lucide-activity
      ui:
        leading: bg-accented/50 p-2 rounded-md border border-muted border-dashed

    - title: Centralized Data & Cost Hub
      description: 'Store all information and unify cloud costs from multiple providers in one secure system for effortless management and analysis.'
      icon: i-lucide-database
      ui:
        leading: bg-accented/50 p-2 rounded-md border border-muted border-dashed

    - title: Accuracy & Budget Alerts
      description: 'Get notified about data anomalies or unexpected cloud spending spikes, keeping your operations trustworthy and financially sound.'
      icon: i-lucide-bell-ring
      ui:
        leading: bg-accented/50 p-2 rounded-md border border-muted border-dashed

    # NEW: Explicit FinOps feature
    - title: Cloud Cost Intelligence (FinOps)
      description: 'Gain visibility and control over AWS, Azure, and GCP spending. Allocate costs, identify savings, and forecast budgets with precision.'
      icon: i-lucide-pie-chart
      ui:
        leading: bg-accented/50 p-2 rounded-md border border-muted border-dashed

    - title: Collaborative Dashboards
      description: 'Empower finance, DevOps, and business teams to work together with shared insights, permissions, and cost accountability.'
      icon: i-lucide-users
      ui:
        leading: bg-accented/50 p-2 rounded-md border border-muted border-dashed

    - title: Insightful Reporting
      description: 'Generate visual reports on data trends and cloud cost performance to understand opportunities for growth and savings at a glance.'
      icon: i-lucide-bar-chart-3
      ui:
        leading: bg-accented/50 p-2 rounded-md border border-muted border-dashed

steps:
  title: 'Streamline your data and cloud operations in [3 steps]{.text-primary}'
  description: 'Simplify data management and cloud financial control with Intraq’s integrated platform.'
  items:
    - title: Connect Your Data & Cloud Sources
      description: 'Easily integrate spreadsheets, CRMs, and cloud providers (AWS, Azure, GCP) with Intraq. Import data and connect billing in minutes.'
      image:
        light: '/images/light/connect.svg'
        dark: '/images/dark/connect.svg'

    - title: Clean, Organize & Analyze Costs
      description: 'Detect duplicates, fix errors, and gain visibility into cloud spend. Identify waste and standardize processes for accuracy and savings.'
      image:
        light: '/images/light/optimize.svg'
        dark: '/images/dark/optimize.svg'

    - title: Optimize, Visualize & Scale
      description: 'Generate reports and dashboards that reveal data trends and cost optimization opportunities. Make decisions that drive growth efficiently.'
      image:
        light: '/images/light/track.svg'
        dark: '/images/dark/track.svg'

pricing:
  title: Choose a plan for your needs
  description: 'Intraq offers flexible solutions for data management and cloud cost optimization, designed for teams and enterprises across Africa with global scalability.'
  plans:
    - name: Starter
      price: "KES 15,000 / project"
      description: 'Perfect for one-off data projects or initial cloud cost assessments.'
      features:
        - Up to 5,000 records processed
        - Basic data formatting and validation
        - Cloud bill visualization for 1 provider
        - 2-day turnaround
        - Email support
      cta: Get Started

    - name: Professional
      price: "KES 40,000 / month"
      description: 'Ideal for growing businesses needing ongoing data and cloud cost management.'
      features:
        - Up to 20,000 records/month
        - Advanced data validation & error correction
        - Multi-cloud cost dashboard & basic alerts
        - Monthly optimization recommendations
        - Priority email & WhatsApp support
      highlight: true
      cta: Subscribe

    - name: Enterprise
      price: "Custom Quote"
      description: 'For organizations requiring advanced automation, analytics, and global FinOps.'
      features:
        - Unlimited record processing
        - Custom FinOps dashboards & API integrations
        - Dedicated account manager & FinOps specialist
        - SLA-backed turnaround & cost-savings targets
        - Multi-currency support & global compliance
        - Optional on-site training
      cta: Contact Sales

model:
  title: How Intraq Delivers Value
  description: 'We combine software automation with expert human support to provide accurate, scalable, and cost-effective data and cloud financial management.'
  model:
    - title: Subscription Plans
      description: 'Fixed monthly/quarterly fees for recurring data and cloud cost management needs, scaled by volume and complexity.'
      icon: i-lucide-calendar

    - title: Project-Based Pricing
      description: 'For one-time data cleanup, migration, or deep-dive cloud cost optimization projects.'
      icon: i-lucide-briefcase

    - title: Managed FinOps Retainers
      description: 'Act as your dedicated Cloud Business Office. We provide specialists, SLAs, and ongoing optimization to maximize your cloud ROI.'
      icon: i-lucide-handshake

    - title: Platform Licensing
      description: 'License Intraq’s data validation and cloud cost intelligence platform for internal use or integration into your systems.'
      icon: i-lucide-cpu

    - title: Consulting & Training
      description: 'Help your teams improve data processes, implement FinOps practices, and adopt tools for long-term efficiency and control.'
      icon: i-lucide-graduation-cap

